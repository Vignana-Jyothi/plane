name: Version Change Before Release

on:
  pull_request:
    branches:
      - master

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # For a fork PR, `ref: github.head_ref` alone checks out a branch of
          # that name from THIS repo (github.repository defaults to the base
          # repo on pull_request events) - if the fork's branch happens to
          # share a name with a real branch here (e.g. both have "preview"),
          # this silently checks out the wrong repo's commits entirely rather
          # than the PR's actual content. Pin both the fork repo and the exact
          # head SHA so this always reads the real PR.
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6

      - name: Get PR Branch version
        run: echo "PR_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Fetch base branch
        # The checkout step above pins `repository:` to the PR's HEAD repo
        # (the fork, for a fork PR) so `origin` here refers to the fork, not
        # this base repo - `git fetch origin master:master` fails outright
        # whenever the fork has no branch literally named "master" (as is
        # normal for a fork whose own work happens on other branch names).
        # `github.repository` is always the base repo on pull_request events
        # (see the comment on the checkout step), so fetch from it by URL
        # instead of relying on the ambiguous `origin` remote name.
        run: git fetch https://github.com/${{ github.repository }}.git master:master

      - name: Get Master Branch version
        run: |
          git checkout master
          echo "MASTER_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Get master branch version and compare
        run: |
          echo "Comparing versions: PR version is $PR_VERSION, Master version is $MASTER_VERSION"
          if [ "$PR_VERSION" == "$MASTER_VERSION" ]; then
            echo "Version in PR branch is the same as in master. Failing the CI."
            exit 1
          else
            echo "Version check passed. Versions are different."
          fi
        env:
          PR_VERSION: ${{ env.PR_VERSION }}
          MASTER_VERSION: ${{ env.MASTER_VERSION }}
