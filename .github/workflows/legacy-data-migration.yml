name: Data operations (manual)

# One-off data operations on the dev-ai server, run through the same
# self-hosted runner that deploys Plane, so nobody needs shell access. See
# docs/vj-startups/legacy_data_migration.md. Trigger it by hand from the Actions
# tab (or `gh workflow run`). Leave "apply" unticked first: that is a dry run and
# writes nothing. Every real run takes a database backup first.
#
# Parts: team-members, problems-and-ideas (legacy data import),
# lock-demo-accounts (neutralise the fixture accounts old deploys created),
# wing-access (give a wing's members access to every project in a workspace),
# instance-admin (let an existing account open Plane's /god-mode/ panel) and
# workspace-member (give an existing account a role in a workspace).
#
# This repository is PUBLIC, so run logs are public. Every email address in the
# output is masked and per-person lines are suppressed - only counts and
# summaries are printed.

on:
  workflow_dispatch:
    inputs:
      part:
        description: Which operation to run
        type: choice
        required: true
        options:
          - team-members
          - problems-and-ideas
          - lock-demo-accounts
          - wing-access
          - instance-admin
          - workspace-member
      apply:
        description: Write to the database (leave unticked for a dry run that writes nothing)
        type: boolean
        default: false
      wing:
        description: "wing-access only: the wing's slug or exact name (e.g. vision)"
        type: string
        required: false
      workspace:
        description: "wing-access and workspace-member: workspace slug"
        type: string
        required: false
        default: vj-startups
      role:
        description: "wing-access: project role to grant; workspace-member: workspace role (15 = Member, 5 = Guest, 20 = Admin)"
        type: choice
        required: false
        default: "15"
        options:
          - "15"
          - "5"
          - "20"
      deactivate:
        description: "lock-demo-accounts only: also deactivate the accounts (otherwise just remove password and superuser)"
        type: boolean
        default: false
      email:
        description: "instance-admin and workspace-member: the email of an account that has already signed in to Plane once"
        type: string
        required: false

concurrency:
  group: legacy-data-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: ${{ inputs.part }} (${{ inputs.apply && 'APPLY' || 'dry run' }})
    runs-on: [self-hosted, dev-ai]
    timeout-minutes: 30
    env:
      APPLY: ${{ inputs.apply }}
    steps:
      - name: Write helpers
        run: |
          cat > "$RUNNER_TEMP/helpers.sh" <<'HELPERS'
          # Replace every email address so nothing personal reaches the public log.
          mask() { sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g'; }

          # run_quiet <keep-regex> <command...>
          # Runs the command, prints only the lines matching keep-regex (masked),
          # or the tail of the output if the command fails.
          run_quiet() {
            local keep="$1"; shift
            local out rc
            set +e
            out=$("$@" 2>&1)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "::error::command failed (exit $rc). Last lines, emails masked:"
              printf '%s\n' "$out" | tail -n 25 | mask
              return "$rc"
            fi
            printf '%s\n' "$out" | grep -E "$keep" | mask | grep -vE '^\s+<email>\s*$' || true
          }
          HELPERS

      - name: Back up the database first
        if: inputs.apply
        env:
          BACKUP_DIR: ${{ vars.BACKUP_DIR }}
          PART: ${{ inputs.part }}
        run: |
          set -euo pipefail
          docker inspect plane-db > /dev/null \
            || { echo "::error::No container named 'plane-db' is running - refusing to write without a backup."; exit 1; }

          dir="${BACKUP_DIR:-$HOME/vj-backups}"
          mkdir -p "$dir"
          chmod 700 "$dir"
          file="$dir/plane_$(date -u +%Y%m%d_%H%M%SZ)_${PART}.dump"

          # Custom-format dump: restorable with pg_restore. The user/db names come
          # from the container's own environment, so nothing is hardcoded here.
          docker exec plane-db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$file"

          # A dump that cannot be listed cannot be restored - check before going on.
          entries=$(docker exec -i plane-db pg_restore -l < "$file" | grep -c '^[0-9]' || true)
          if [ "${entries:-0}" -lt 50 ]; then
            rm -f "$file"
            echo "::error::The backup looks empty or corrupt (${entries:-0} objects) - refusing to continue."
            exit 1
          fi
          echo "Backup OK: $entries objects, $(du -h "$file" | cut -f1), saved on the runner host at $file"

          # Keep the 10 most recent backups.
          ls -1t "$dir"/plane_*.dump 2>/dev/null | tail -n +11 | xargs -r rm -f

      - name: Lock the demo accounts
        if: inputs.part == 'lock-demo-accounts'
        env:
          DEACTIVATE: ${{ inputs.deactivate }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/helpers.sh"

          docker inspect api > /dev/null || { echo "::error::No container named 'api' is running."; exit 1; }
          docker exec api test -f plane/vj_startups/management/commands/lock_demo_accounts.py \
            || { echo "::error::lock_demo_accounts is not in the running API image yet - wait for the Plane deploy to finish."; exit 1; }

          flags=""
          if [ "$APPLY" != "true" ]; then flags="--dry-run"; fi
          if [ "$DEACTIVATE" = "true" ]; then flags="$flags --deactivate"; fi
          echo "Mode: $([ "$APPLY" = "true" ] && echo APPLY || echo 'dry run - nothing is written')"
          run_quiet '.' docker exec api python manage.py lock_demo_accounts $flags

      - name: Give a wing access to every project in a workspace
        if: inputs.part == 'wing-access'
        env:
          WING: ${{ inputs.wing }}
          WORKSPACE: ${{ inputs.workspace }}
          ROLE: ${{ inputs.role }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/helpers.sh"

          if [ -z "$WING" ]; then
            echo "::error::Fill in the 'wing' input (the wing's slug or exact name)."
            exit 1
          fi
          for value in "$WING" "$WORKSPACE"; do
            if ! printf '%s' "$value" | grep -Eq '^[A-Za-z0-9 ._-]+$'; then
              echo "::error::wing and workspace may only contain letters, digits, spaces, dots, dashes and underscores."
              exit 1
            fi
          done
          docker inspect api > /dev/null || { echo "::error::No container named 'api' is running."; exit 1; }

          flags=""
          if [ "$APPLY" != "true" ]; then flags="--dry-run"; fi
          echo "Mode: $([ "$APPLY" = "true" ] && echo APPLY || echo 'dry run - nothing is written')"
          # Per-person "+ email -> project" lines are dropped; the summary is enough.
          run_quiet '^(Wing |Workspace |Dry run|Granted|Nothing|  \(added)' \
            docker exec api python manage.py grant_wing_project_access \
              --wing "$WING" --workspace "$WORKSPACE" --role "$ROLE" $flags

      # Instance Admin is Plane's own list of people who may open /god-mode/. It is separate from
      # the site's ADMIN role (Ecosystem Users) and from being an Admin inside a workspace. The
      # account must already exist, i.e. the person has signed in to Plane once.
      - name: Make an account a Plane Instance Admin
        if: inputs.part == 'instance-admin'
        env:
          ADMIN_EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/helpers.sh"

          email=$(printf '%s' "$ADMIN_EMAIL" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if ! printf '%s' "$email" | grep -Eq '^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$'; then
            echo "::error::Fill in the 'email' input with a valid email address."
            exit 1
          fi
          docker inspect api > /dev/null || { echo "::error::No container named 'api' is running."; exit 1; }
          docker exec api test -f plane/db/management/commands/create_instance_admin.py \
            || { echo "::error::create_instance_admin is not in the running API image."; exit 1; }
          export ADMIN_EMAIL="$email"

          # The address is passed through the environment, never pasted into code, and is not
          # printed: this repository's logs are public.
          check_py='import os
          from plane.db.models import User
          from plane.license.models import InstanceAdmin
          user = User.objects.filter(email=os.environ["ADMIN_EMAIL"]).first()
          if user is None:
              print("account exists: NO - the person must sign in to Plane once first")
          else:
              print("account exists: yes")
              print("active: " + ("yes" if user.is_active else "NO"))
              print("already an instance admin: " + ("yes" if InstanceAdmin.objects.filter(user=user).exists() else "no"))'

          echo "Mode: $([ "$APPLY" = "true" ] && echo APPLY || echo 'dry run - nothing is written')"
          printf '%s\n' "$check_py" | docker exec -i -e ADMIN_EMAIL api python manage.py shell 2>&1 \
            | grep -E '^(account exists|active|already an instance admin)' \
            || { echo "::error::Could not check the account."; exit 1; }

          if [ "$APPLY" = "true" ]; then
            # Refuses (with a clear message) if the account is missing or already an admin.
            run_quiet '.' docker exec api python manage.py create_instance_admin "$email"
          fi

      # Gives an existing account a role in a workspace (default: vj-startups): adds it, re-activates
      # a deactivated membership, or raises a lower role. Never lowers a role. Being an Instance
      # Admin does not put anyone inside a workspace, which is what this is for.
      - name: Give an account a role in a workspace
        if: inputs.part == 'workspace-member'
        env:
          MEMBER_EMAIL: ${{ inputs.email }}
          WORKSPACE: ${{ inputs.workspace }}
          ROLE: ${{ inputs.role }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/helpers.sh"

          email=$(printf '%s' "$MEMBER_EMAIL" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          if ! printf '%s' "$email" | grep -Eq '^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$'; then
            echo "::error::Fill in the 'email' input with a valid email address."
            exit 1
          fi
          if ! printf '%s' "$WORKSPACE" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::workspace may only contain letters, digits, dots, dashes and underscores."
            exit 1
          fi
          docker inspect api > /dev/null || { echo "::error::No container named 'api' is running."; exit 1; }
          docker exec api test -f plane/vj_startups/management/commands/grant_workspace_role.py \
            || { echo "::error::grant_workspace_role is not in the running API image yet - wait for the Plane deploy to finish."; exit 1; }

          flags=""
          if [ "$APPLY" != "true" ]; then flags="--dry-run"; fi
          echo "Mode: $([ "$APPLY" = "true" ] && echo APPLY || echo 'dry run - nothing is written')"
          # The address is not printed (this repository's logs are public); the command prints only
          # what it did, and a failure shows the masked tail of its output.
          run_quiet '^(Would apply|Applied|Nothing to do|Dry run)' \
            docker exec api python manage.py grant_workspace_role \
              --email "$email" --role "$ROLE" --workspace "$WORKSPACE" $flags

      - name: Team members (wings, roles, headline, LinkedIn)
        if: inputs.part == 'team-members'
        env:
          TEAM_SHEET_CSV: ${{ secrets.TEAM_SHEET_CSV }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/helpers.sh"

          if [ -z "${TEAM_SHEET_CSV:-}" ]; then
            echo "::error::The TEAM_SHEET_CSV secret is not set. Add the team sheet (exported as CSV) as a repository secret first."
            exit 1
          fi
          docker inspect api > /dev/null || { echo "::error::No container named 'api' is running."; exit 1; }
          docker exec api test -f plane/vj_startups/management/commands/import_team_members.py \
            || { echo "::error::import_team_members is not in the running API image yet - wait for the Plane deploy to finish."; exit 1; }

          trap 'docker exec api rm -f /tmp/team.csv' EXIT
          printf '%s\n' "$TEAM_SHEET_CSV" | docker exec -i api sh -c 'cat > /tmp/team.csv'

          flags="--create-missing"
          if [ "$APPLY" != "true" ]; then flags="$flags --dry-run"; fi
          echo "Mode: $([ "$APPLY" = "true" ] && echo APPLY || echo 'dry run - nothing is written')"
          run_quiet '^(Would apply|Applied|Skipped|[0-9]+ skipped|  (create|update):)' \
            docker exec api python manage.py import_team_members --csv-file /tmp/team.csv $flags

      - name: Find the backend 2 container
        if: inputs.part == 'problems-and-ideas'
        run: |
          set -euo pipefail
          mapfile -t found < <(docker ps --filter publish=6220 --format '{{.Names}}')
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error::expected exactly one container publishing port 6220, found ${#found[@]}: ${found[*]:-none}"
            exit 1
          fi
          docker exec "${found[0]}" test -f scripts/import-legacy-mongo.js \
            || { echo "::error::The migration scripts are not in the backend 2 image yet - wait for its deploy to finish."; exit 1; }
          docker inspect api > /dev/null || { echo "::error::No container named 'api' is running."; exit 1; }
          echo "BACKEND=${found[0]}" >> "$GITHUB_ENV"
          echo "Mode: $([ "$APPLY" = "true" ] && echo APPLY || echo 'dry run - nothing is written')"

      - name: Download problems and ideas from the live site (read-only)
        if: inputs.part == 'problems-and-ideas'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/helpers.sh"
          run_quiet '^(Saved|WARNING)' docker exec "$BACKEND" node scripts/fetch-legacy-public-data.js --out /tmp/legacy

      - name: List the people who need accounts
        if: inputs.part == 'problems-and-ideas'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/helpers.sh"
          run_quiet '^Wrote' docker exec "$BACKEND" node scripts/extract-legacy-users.js \
            --problems /tmp/legacy/problems.json --ideas /tmp/legacy/ideas.json --out /tmp/legacy/users.json
          docker exec "$BACKEND" cat /tmp/legacy/users.json | docker exec -i api sh -c 'cat > /tmp/users.json'

      - name: Create the accounts (Plane)
        if: inputs.part == 'problems-and-ideas'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/helpers.sh"
          flags=""
          if [ "$APPLY" != "true" ]; then flags="--dry-run"; fi
          # The command prints one line per person (with usernames derived from
          # their email) - keep only the totals.
          run_quiet '^(Reading|Connecting|Fetched|Processing|Migration completed|Failed|Error)' \
            docker exec api python manage.py migrate_mongo_users --json-file /tmp/users.json $flags

      - name: Preview the import (now that the accounts exist)
        if: inputs.part == 'problems-and-ideas' && inputs.apply
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/helpers.sh"
          run_quiet '^(DRY RUN|People referenced|Problems:|Ideas:|Finished|  [0-9]+ (skipped|warning|FAILED)|  source fields)' \
            docker exec "$BACKEND" node scripts/import-legacy-mongo.js \
              --problems /tmp/legacy/problems.json --ideas /tmp/legacy/ideas.json --dry-run

      - name: Import problems and ideas
        if: inputs.part == 'problems-and-ideas'
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/helpers.sh"
          if [ "$APPLY" = "true" ]; then
            flags=""
            keep='.'
          else
            flags="--dry-run"
            keep='^(DRY RUN|People referenced|Problems:|Ideas:|Finished|  [0-9]+ (skipped|warning|FAILED)|  source fields)'
            echo "Dry run: the accounts above were NOT created, so the importer will report people without an account and skip their records. Counts only are shown."
          fi
          run_quiet "$keep" docker exec "$BACKEND" node scripts/import-legacy-mongo.js \
            --problems /tmp/legacy/problems.json --ideas /tmp/legacy/ideas.json $flags

      - name: Clean up temporary files
        if: always() && inputs.part == 'problems-and-ideas'
        run: |
          if [ -n "${BACKEND:-}" ]; then docker exec "$BACKEND" rm -rf /tmp/legacy || true; fi
          docker exec api rm -f /tmp/users.json || true
