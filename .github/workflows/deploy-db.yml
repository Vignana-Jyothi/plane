name: Deploy Database to dev-ai

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/api/plane/vj_startups/**'
      - 'docker-compose.yml'

jobs:
  deploy-db:
    name: Deploy Database & Run Migrations
    runs-on: [self-hosted, dev-ai] # Targets your specific self-hosted runner
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment Variables
        run: |
          # Manually copy .env files and generate SECRET_KEY to avoid pnpm/corepack permission errors
          cp .env.example .env
          cp apps/api/.env.example apps/api/.env
          SECRET_KEY=$(tr -dc 'a-z0-9' < /dev/urandom | head -c50)
          echo "SECRET_KEY=\"\$SECRET_KEY\"" >> apps/api/.env
      - name: Expose Database Port (Override)
        run: |
          # Create an override file to expose port 5432 without modifying the main docker-compose.yml
          cat <<EOF > docker-compose.override.yml
          services:
            plane-db:
              ports:
                - "5434:5432"
          EOF
          
      - name: Start Database Container
        run: |
          docker compose up -d plane-db
          
      - name: Wait for Database to Initialize
        run: |
          echo "Waiting for PostgreSQL to accept connections..."
          # Give it a few seconds to start up before running migrations
          sleep 10 
          
      - name: Run Django Migrations
        run: |
          docker compose run --rm api python manage.py migrate
          
      - name: Seed VJ Startups Data
        run: |
          docker compose run --rm api python manage.py seed_vj_startups
